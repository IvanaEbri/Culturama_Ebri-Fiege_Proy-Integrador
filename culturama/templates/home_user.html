{% extends 'base.html' %}

{% block title %}Inicio Usuario{% endblock %}

{% load static %}

{% block body %}
<!-- Carrusel de imágenes -->
<div id="carouselExample" class="carousel slide" data-ride="carousel">
    <div class="carousel-inner">
        <div class="carousel-item active">
            <img src="{% static 'images/river.jpeg' %}" class="d-block w-100" alt="Imagen 1">
        </div>
        <div class="carousel-item">
            <img src="{% static 'images/artes.jpg' %}" class="d-block w-100" alt="Imagen 2">
        </div>
        <div class="carousel-item">
            <img src="{% static 'images/fragata.jpg' %}" class="d-block w-100" alt="Imagen 3">
        </div>
        <div class="carousel-item">
            <img src="{% static 'images/puentee.jpeg' %}" class="d-block w-100" alt="Imagen 4">
        </div>
        <div class="carousel-item">
            <img src="{% static 'images/rosedal.jpg' %}" class="d-block w-100" alt="Imagen 5">
        </div>
        <div class="carousel-item">
            <img src="{% static 'images/teatroo.webp' %}" class="d-block w-100" alt="Imagen 6">
        </div>
    </div>
    <button class="carousel-control-prev" type="button" data-target="#carouselExample" data-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="sr-only">Anterior</span>
    </button>
    <button class="carousel-control-next" type="button" data-target="#carouselExample" data-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="sr-only">Siguiente</span>
    </button>
</div>


<div class="home-buttons">
    <a href="{% url 'Route1' %}">
        <button>Recorrido</button>
    </a>
    <a href="{% url 'Map' %}">
        <button>Mapa</button>
    </a>
</div>

{% endblock %}
