{% extends 'base.html' %}

{% block title %}
    Crear Nueva Etiqueta - ☀️
{% endblock %}
{% block body %}
{% load static %}
<div class="admin-container">
    <h1>Registrar Nueva Etiqueta</h1>
    
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-group">
            {{ form.as_p }}
        </div>
        <button type="submit" class="admin-button">
            Crear
        </button>
    </form>
</div>
{% endblock %}
