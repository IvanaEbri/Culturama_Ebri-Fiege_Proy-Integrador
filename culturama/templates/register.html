<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Registro - ☀️{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="register-container">
        
        <img src="{% static 'images/cultu.png' %}" alt="Logo de Culturama" class="home-logo">
        <br>
        <h2>Registro</h2>
        <form method="post" class="register-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="register-button">Registrarse</button>
        </form>

        <p>¿Ya tenes una cuenta? <a href="{% url 'Login' %}">Inicia sesión acá</a></p>
    </div>

</body>
</html>
