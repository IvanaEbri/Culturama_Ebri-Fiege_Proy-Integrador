{% extends 'base.html' %}

{% block title %}Elige tus Sitios{% endblock %}

{% block body %}
<div class="recorrido-container">
    <h1>¿Cuántas paradas hacemos?</h1>
    
    {% comment %} <form method="post" action="{% url 'Answer' tag_id=tag.id_tag cant_paradas=6 %}"> 
        {% csrf_token %}
        <input type="hidden" name="tag_id" value="{{ tag.id_tag }}"> 
        
        <div class="paradas-buttons">
            <button type="submit" name="paradas" value="1" class="btn">1 lugar</button>
            <button type="submit" name="paradas" value="2" class="btn">2 lugares</button>
            <button type="submit" name="paradas" value="3" class="btn">3 lugares</button>
            <button type="submit" name="paradas" value="4" class="btn">4 lugares</button>
        </div>
    
        <div>
            <input type="hidden" name="paradas" value="random">
            <button type="submit" class="surprise-btn">Sorpréndeme</button>
        </div>
    </form> {% endcomment %}

    <form method="post">
        {% csrf_token %}
        <div class="button-group">
            {% for sites in site_options %}
                <button type="submit" name="sites" value="{{ sites }}" class="btn btn-primary" action= "{% url 'Answer' tag_id=tag.id_tag  cant_paradas=sites %}" >{{ sites }} {% if sites == 1 %}lugar{% else %}lugares {% endif %}</button>
            {% endfor %}
            <button type="submit" name="sites" value="random" class="surprise-btn" action= "{% url 'Answer' tag_id=tag.id_tag cant_paradas="random" %}" >Sorpréndeme</button>
        </div>  
    </form>
    
</div>
{% endblock %}
